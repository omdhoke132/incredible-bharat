name: Project quality and security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint, API regression tests, and production build
        run: npm run check

      - name: Audit dependencies
        shell: bash
        run: |
          set +e
          npm audit --json --audit-level=high > npm-audit.json
          audit_status=$?
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          const details = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            package: name,
            severity: item.severity,
            affectedRange: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via ?? []).map((entry) => typeof entry === "string" ? entry : entry.title)
          }));
          console.log(JSON.stringify({ vulnerabilityCounts: counts, details }, null, 2));
          NODE
          exit "$audit_status"
