name: Quality checks

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Summarize dependency audit findings
        shell: bash
        run: |
          npm audit --json > /tmp/dependency-audit.json || true
          node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync("/tmp/dependency-audit.json", "utf8")); const items = Object.entries(report.vulnerabilities || {}); if (!items.length) console.log("No dependency vulnerabilities reported."); for (const [name, item] of items) console.log(name + " | severity=" + item.severity + " | direct=" + item.isDirect + " | fixAvailable=" + JSON.stringify(item.fixAvailable) + " | via=" + item.via.map((v) => typeof v === "string" ? v : v.name + ":" + v.range).join(", "));'
      - name: Run lint, data tests, and production build
        run: npm run check
